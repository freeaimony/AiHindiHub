
name: AI Automatic Article

on:
  workflow_dispatch:

  schedule:
    # 09:00 IST
    - cron: "30 3 * * *"

    # 17:00 IST
    - cron: "30 11 * * *"

    # 23:00 IST
    - cron: "30 17 * * *"

permissions:
  contents: write

concurrency:
  group: ai-article
  cancel-in-progress: false

jobs:

  generate-article:

    runs-on: ubuntu-latest

    steps:

      # ============================================
      # CHECKOUT
      # ============================================

      - name: Checkout repository

        uses: actions/checkout@v4


      # ============================================
      # GENERATE ARTICLE
      # ============================================

      - name: Generate article with Gemini

        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

        run: |

          cat > generate_article.py <<'PY'

          import os
          import json
          import re
          import html
          import time
          import urllib.request
          import urllib.error
          from datetime import datetime, timezone


          # ============================================
          # API KEY
          # ============================================

          API_KEY = os.environ.get("GEMINI_API_KEY")

          if not API_KEY:
              raise SystemExit(
                  "ERROR: GEMINI_API_KEY secret is missing."
              )


          # ============================================
          # WEBSITE
          # ============================================

          SITE = "https://freeaimony.github.io/AiHindiHub/"


          # ============================================
          # AVAILABLE GEMINI MODELS
          # ============================================

          def get_available_model():

              url = (
                  "https://generativelanguage.googleapis.com/"
                  "v1beta/models"
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "x-goog-api-key": API_KEY
                  },
                  method="GET"
              )

              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=60
                  ) as response:

                      data = json.loads(
                          response.read().decode("utf-8")
                      )

              except Exception as e:

                  raise SystemExit(
                      "Could not get Gemini model list: "
                      + str(e)
                  )


              models = data.get("models", [])


              preferred = [
                  "gemini-3.5-flash",
                  "gemini-3.1-flash-lite",
                  "gemini-2.5-flash-lite",
                  "gemini-2.5-flash"
              ]


              for preferred_name in preferred:

                  for model in models:

                      name = model.get("name", "")

                      methods = model.get(
                          "supportedGenerationMethods",
                          []
                      )

                      if (
                          name == "models/" + preferred_name
                          and
                          "generateContent" in methods
                      ):

                          print(
                              "Selected Gemini model:",
                              name
                          )

                          return name


              # Generic fallback

              for model in models:

                  name = model.get("name", "")

                  methods = model.get(
                      "supportedGenerationMethods",
                      []
                  )

                  if (
                      name.startswith("models/gemini-")
                      and
                      "generateContent" in methods
                  ):

                      print(
                          "Selected fallback Gemini model:",
                          name
                      )

                      return name


              raise SystemExit(
                  "No Gemini model supporting generateContent "
                  "was found for this API key."
              )


          MODEL = get_available_model()


          # ============================================
          # FIND EXISTING ARTICLES
          # ============================================

          existing_articles = []


          ignored_files = {
              "index.html",
              "about.html",
              "aitools.html",
              "contact.html",
              "Contact.html",
              "privacy.html",
              "terms.html",
              "disclaimer.html"
          }


          for filename in os.listdir("."):

              if not filename.endswith(".html"):
                  continue

              if filename in ignored_files:
                  continue

              try:

                  with open(
                      filename,
                      "r",
                      encoding="utf-8"
                  ) as f:

                      content = f.read()


                  match = re.search(
                      r"<title[^>]*>(.*?)</title>",
                      content,
                      re.I | re.S
                  )


                  if match:

                      article_title = re.sub(
                          r"<[^>]+>",
                          "",
                          match.group(1)
                      )

                      article_title = html.unescape(
                          article_title
                      )

                      article_title = re.sub(
                          r"\s+",
                          " ",
                          article_title
                      ).strip()


                      article_title = re.sub(
                          r"\s*\|\s*AIHindiHub\s*$",
                          "",
                          article_title,
                          flags=re.I
                      )


                      if article_title:

                          existing_articles.append(
                              {
                                  "file": filename,
                                  "title": article_title
                              }
                          )

              except Exception:
                  pass


          print(
              "Existing articles:",
              len(existing_articles)
          )


          previous_titles = "\n".join(
              "- " + x["title"]
              for x in existing_articles[-40:]
          )


          # ============================================
          # AI PROMPT
          # ============================================

          prompt = f"""
          तुम AiHindiHub नाम की Hindi AI और Technology website
          के लिए एक नया original SEO-friendly article लिख रहे हो।

          Website:
          {SITE}

          Article का topic इन categories में से होना चाहिए:

          AI
          Artificial Intelligence
          AI Tools
          Technology
          Students
          Productivity
          Useful Apps
          Online Work
          Digital Technology

          पहले से प्रकाशित articles:

          {previous_titles}

          IMPORTANT RULES:

          1. बिल्कुल नया topic चुनो।
          2. Existing articles को repeat मत करो।
          3. Article पूरी तरह Hindi में लिखो।
          4. जरूरी technical terms English में रख सकते हो।
          5. Content original होना चाहिए।
          6. किसी website से text copy मत करो।
          7. Article लगभग 1200 से 1400 words का होना चाहिए।
          8. 1000 words से कम नहीं होना चाहिए।
          9. 1500 words से ज्यादा बिल्कुल नहीं होना चाहिए।
          10. Strong introduction दो।
          11. H2 और H3 headings इस्तेमाल करो।
          12. Practical examples दो।
          13. Useful tips दो।
          14. जरूरत के अनुसार ul, ol और table HTML इस्तेमाल कर सकते हो।
          15. Keyword stuffing मत करो।
          16. Fake statistics मत बनाओ।
          17. Fake claims मत करो।
          18. Markdown इस्तेमाल मत करो।
          19. केवल HTML article body दो।
          20. अंत में Conclusion जरूर दो।
          21. Title छोटा और clickable होना चाहिए।
          22. Meta description maximum 155 characters हो।
          23. Slug English lowercase और hyphen वाला हो।
          24. External links मत डालो।
          25. केवल valid JSON वापस करो।
          26. JSON के बाहर कोई text मत लिखो।

          JSON FORMAT:

          {{
            "title": "SEO Article Title",
            "description": "SEO meta description",
            "slug": "seo-friendly-slug",
            "keywords": "keyword1, keyword2, keyword3",
            "html": "<article><p>...</p><h2>...</h2></article>"
          }}
          """


          # ============================================
          # GEMINI REQUEST
          # ============================================

          def call_gemini():

              url = (
                  "https://generativelanguage.googleapis.com/"
                  "v1beta/"
                  + MODEL
                  + ":generateContent"
              )


              payload = {
                  "contents": [
                      {
                          "parts": [
                              {
                                  "text": prompt
                              }
                          ]
                      }
                  ],
                  "generationConfig": {
                      "temperature": 0.7,
                      "maxOutputTokens": 8000
                  }
              }


              request_data = json.dumps(
                  payload,
                  ensure_ascii=False
              ).encode("utf-8")


              for attempt in range(1, 4):

                  print(
                      f"Gemini request {attempt}/3..."
                  )


                  request = urllib.request.Request(
                      url,
                      data=request_data,
                      headers={
                          "Content-Type": "application/json",
                          "x-goog-api-key": API_KEY
                      },
                      method="POST"
                  )


                  try:

                      with urllib.request.urlopen(
                          request,
                          timeout=180
                      ) as response:

                          raw = response.read().decode(
                              "utf-8"
                          )

                          data = json.loads(raw)


                      candidates = data.get(
                          "candidates",
                          []
                      )


                      if candidates:

                          parts = (
                              candidates[0]
                              .get("content", {})
                              .get("parts", [])
                          )


                          text_parts = []


                          for part in parts:

                              if part.get("text"):

                                  text_parts.append(
                                      part["text"]
                                  )


                          output = "".join(
                              text_parts
                          ).strip()


                          if output:

                              print(
                                  "Gemini response received."
                              )

                              return output


                      print(
                          "Gemini returned empty response."
                      )


                  except urllib.error.HTTPError as e:

                      error_body = ""

                      try:

                          error_body = (
                              e.read()
                              .decode("utf-8")
                          )

                      except Exception:
                          pass


                      print(
                          "Gemini HTTP error:",
                          e.code
                      )

                      print(
                          error_body[:1500]
                      )


                      if e.code in [
                          429,
                          500,
                          502,
                          503,
                          504
                      ]:

                          if attempt < 3:

                              time.sleep(
                                  attempt * 10
                              )

                              continue


                      raise


                  except Exception as e:

                      print(
                          "Gemini connection error:",
                          str(e)
                      )


                      if attempt < 3:

                          time.sleep(
                              attempt * 10
                          )

                          continue


                      raise


              raise SystemExit(
                  "Gemini failed after 3 attempts."
              )


          # ============================================
          # GET AI OUTPUT
          # ============================================

          output = call_gemini()


          # ============================================
          # CLEAN JSON
          # ============================================

          output = output.strip()


          output = re.sub(
              r"^```json\s*",
              "",
              output,
              flags=re.I
          )


          output = re.sub(
              r"^```\s*",
              "",
              output
          )


          output = re.sub(
              r"\s*```$",
              "",
              output
          ).strip()


          article = None


          try:

              article = json.loads(
                  output
              )

          except json.JSONDecodeError:

              start = output.find("{")
              end = output.rfind("}")


              if start >= 0 and end > start:

                  try:

                      article = json.loads(
                          output[start:end + 1]
                      )

                  except Exception:
                      article = None


          if not isinstance(article, dict):

              raise SystemExit(
                  "Gemini returned invalid JSON."
              )


          # ============================================
          # REQUIRED FIELDS
          # ============================================

          required = [
              "title",
              "description",
              "slug",
              "keywords",
              "html"
          ]


          for field in required:

              if not article.get(field):

                  raise SystemExit(
                      "Missing field: " + field
                  )


          title = str(
              article["title"]
          ).strip()


          description = str(
              article["description"]
          ).strip()


          keywords = str(
              article["keywords"]
          ).strip()


          body_html = str(
              article["html"]
          ).strip()


          # ============================================
          # DESCRIPTION LIMIT
          # ============================================

          description = re.sub(
              r"\s+",
              " ",
              description
          ).strip()


          description = description[:155]


          # ============================================
          # REMOVE DANGEROUS HTML
          # ============================================

          body_html = re.sub(
              r"<script\b[^>]*>.*?</script>",
              "",
              body_html,
              flags=re.I | re.S
          )


          body_html = re.sub(
              r"<iframe\b[^>]*>.*?</iframe>",
              "",
              body_html,
              flags=re.I | re.S
          )


          # ============================================
          # WORD COUNT
          # ============================================

          plain_text = re.sub(
              r"<[^>]+>",
              " ",
              body_html
          )


          plain_text = html.unescape(
              plain_text
          )


          plain_text = re.sub(
              r"\s+",
              " ",
              plain_text
          ).strip()


          word_count = len(
              plain_text.split()
          )


          print(
              "Article word count:",
              word_count
          )


          if word_count < 1000:

              raise SystemExit(
                  f"Article too short: {word_count} words."
              )


          if word_count > 1500:

              raise SystemExit(
                  f"Article too long: {word_count} words."
              )


          # ============================================
          # SLUG
          # ============================================

          slug = str(
              article["slug"]
          ).strip().lower()


          slug = re.sub(
              r"[^a-z0-9-]",
              "-",
              slug
          )


          slug = re.sub(
              r"-+",
              "-",
              slug
          ).strip("-")


          if not slug:

              raise SystemExit(
                  "Invalid slug."
              )


          filename = slug + ".html"


          if os.path.exists(filename):

              timestamp = datetime.now(
                  timezone.utc
              ).strftime(
                  "%Y%m%d%H%M%S"
              )


              filename = (
                  slug
                  + "-"
                  + timestamp
                  + ".html"
              )


          # ============================================
          # DATE / URL
          # ============================================

          now = datetime.now(
              timezone.utc
          )


          today = now.strftime(
              "%Y-%m-%d"
          )


          published_iso = now.strftime(
              "%Y-%m-%dT%H:%M:%SZ"
          )


          article_url = SITE + filename


          # ============================================
          # FIND LAST ARTICLES
          # ============================================

          existing_articles = []


          for f in os.listdir("."):

              if not f.endswith(".html"):
                  continue


              if f in ignored_files:
                  continue


              try:

                  with open(
                      f,
                      "r",
                      encoding="utf-8"
                  ) as rf:

                      text = rf.read()


                  match = re.search(
                      r"<title[^>]*>(.*?)</title>",
                      text,
                      re.I | re.S
                  )


                  if match:

                      old_title = re.sub(
                          r"<[^>]+>",
                          "",
                          match.group(1)
                      )


                      old_title = html.unescape(
                          old_title
                      )


                      old_title = re.sub(
                          r"\s+",
                          " ",
                          old_title
                      ).strip()


                      old_title = re.sub(
                          r"\s*\|\s*AIHindiHub\s*$",
                          "",
                          old_title,
                          flags=re.I
                      )


                      if old_title:

                          existing_articles.append(
                              {
                                  "file": f,
                                  "title": old_title
                              }
                          )


              except Exception:
                  pass


          related = existing_articles[-5:]


          # ============================================
          # RELATED ARTICLES
          # ============================================

          related_html = ""


          if related:

              related_html = """
          <section class="related-articles">
          <h2>आपके लिए उपयोगी लेख</h2>
          <ul>
          """


              for item in reversed(related):

                  related_html += (
                      "<li>"
                      '<a href="'
                      + html.escape(
                          item["file"],
                          quote=True
                      )
                      + '">'
                      + html.escape(
                          item["title"]
                      )
                      + "</a>"
                      "</li>"
                  )


              related_html += """
          </ul>
          </section>
          """


          # ============================================
          # SCHEMA
          # ============================================

          schema = {

              "@context": "https://schema.org",

              "@type": "Article",

              "headline": title,

              "description": description,

              "keywords": keywords,

              "datePublished": published_iso,

              "dateModified": published_iso,

              "inLanguage": "hi-IN",

              "author": {
                  "@type": "Organization",
                  "name": "AIHindiHub",
                  "url": SITE
              },

              "publisher": {
                  "@type": "Organization",
                  "name": "AIHindiHub",
                  "url": SITE
              },

              "mainEntityOfPage": {
                  "@type": "WebPage",
                  "@id": article_url
              }
          }


          schema_json = json.dumps(
              schema,
              ensure_ascii=False,
              indent=2
          )


          # ============================================
          # CREATE ARTICLE PAGE
          # ============================================

          safe_title = html.escape(
              title
          )


          safe_description = html.escape(
              description,
              quote=True
          )


          safe_keywords = html.escape(
              keywords,
              quote=True
          )


          safe_url = html.escape(
              article_url,
              quote=True
          )


          page = f"""<!DOCTYPE html>
          <html lang="hi">

          <head>

          <meta charset="UTF-8">

          <meta
              name="viewport"
              content="width=device-width, initial-scale=1.0"
          >

          <title>{safe_title} | AIHindiHub</title>

          <meta
              name="description"
              content="{safe_description}"
          >

          <meta
              name="keywords"
              content="{safe_keywords}"
          >

          <meta
              name="robots"
              content="index, follow"
          >

          <link
              rel="canonical"
              href="{safe_url}"
          >

          <link
              rel="stylesheet"
              href="style.css"
          >

          <script type="application/ld+json">
          {schema_json}
          </script>

          </head>

          <body>

          <main class="container">

          <article class="ai-generated-article">

          {body_html}

          </article>

          {related_html}

          </main>

          </body>

          </html>
          """


          with open(
              filename,
              "w",
              encoding="utf-8"
          ) as f:

              f.write(page)


          print(
              "Article created:",
              filename
          )


          # ============================================
          # UPDATE HOMEPAGE
          # ============================================

          index_file = "index.html"


          if not os.path.exists(index_file):

              raise SystemExit(
                  "index.html not found."
              )


          with open(
              index_file,
              "r",
              encoding="utf-8"
          ) as f:

              index = f.read()


          marker_start = (
              "<!-- AI-AUTO-ARTICLES-START -->"
          )


          marker_end = (
              "<!-- AI-AUTO-ARTICLES-END -->"
          )


          new_card = f"""
          <div class="article-card ai-generated-article-card">

              <h3>{safe_title}</h3>

              <p>{safe_description}</p>

              <a
                  href="{html.escape(filename, quote=True)}"
                  class="read-btn"
              >
                  Read More →
              </a>

          </div>
          """


          if (
              marker_start in index
              and marker_end in index
          ):

              start_pos = (
                  index.find(marker_start)
                  + len(marker_start)
              )


              index = (
                  index[:start_pos]
                  + new_card
                  + index[start_pos:]
              )


          else:

              latest_position = index.find(
                  "<!-- Latest Articles -->"
              )


              if latest_position >= 0:

                  grid_position = index.find(
                      '<div class="article-grid">',
                      latest_position
                  )


                  if grid_position >= 0:

                      insert_position = (
                          grid_position
                          + len(
                              '<div class="article-grid">'
                          )
                      )


                      block = f"""

          {marker_start}

          {new_card}

          {marker_end}

          """


                      index = (
                          index[:insert_position]
                          + block
                          + index[insert_position:]
                      )


          with open(
              index_file,
              "w",
              encoding="utf-8"
          ) as f:

              f.write(index)


          # ============================================
          # REBUILD SITEMAP
          # ============================================

          static_pages = [
              "index.html",
              "about.html",
              "aitools.html",
              "Contact.html",
              "contact.html",
              "privacy.html",
              "terms.html",
              "disclaimer.html"
          ]


          sitemap_urls = []


          for static_file in static_pages:

              if os.path.exists(static_file):

                  if static_file == "index.html":

                      sitemap_urls.append(
                          SITE
                      )

                  else:

                      sitemap_urls.append(
                          SITE + static_file
                      )


          for item in existing_articles:

              sitemap_urls.append(
                  SITE + item["file"]
              )


          sitemap_urls.append(
              article_url
          )


          sitemap_urls = list(
              dict.fromkeys(
                  sitemap_urls
              )
          )


          sitemap = """<?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
          """


          for url_item in sitemap_urls:

              sitemap += f"""
          <url>
              <loc>{html.escape(url_item)}</loc>
              <lastmod>{today}</lastmod>
          </url>
          """


          sitemap += """
          </urlset>
          """


          with open(
              "sitemap.xml",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(sitemap)


          # ============================================
          # SUCCESS
          # ============================================

          print("")
          print("======================================")
          print("AI ARTICLE SUCCESSFULLY CREATED")
          print("======================================")
          print("Model:", MODEL)
          print("Title:", title)
          print("Words:", word_count)
          print("File:", filename)
          print("URL:", article_url)
          print("Sitemap URLs:", len(sitemap_urls))
          print("======================================")


          PY


          python3 generate_article.py


      # ============================================
      # COMMIT AND PUSH
      # ============================================

      - name: Commit and push article

        run: |

          git config user.name "AIHindiHub AI"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then

            echo "No changes to commit."

            exit 0

          fi

          git commit \
            -m "AI: publish new Hindi SEO article"

          git push  
