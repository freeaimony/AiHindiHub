name: AI Automatic Article

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: write

jobs:
  generate-article:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate article with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 <<'PY'
          import os
          import json
          import re
          import urllib.request
          from datetime import datetime, timezone

          API_KEY = os.environ.get("GEMINI_API_KEY")

          if not API_KEY:
              raise SystemExit("GEMINI_API_KEY secret is missing.")

          prompt = """
          तुम AiHindiHub नाम की Hindi AI और Technology website के लिए एक नया
          original और useful SEO-friendly article लिख रहे हो।

          AI, Technology, AI Tools, Students, Productivity, Online Work,
          Useful Apps या Digital Technology से संबंधित एक नया विषय चुनो।

          Article पूरी तरह Hindi में होना चाहिए।
          जरूरी technical terms English में रख सकते हो।

          Article कम से कम 1200 शब्दों का हो।

          नियम:
          - Original content लिखो।
          - किसी website का text copy मत करो।
          - Keyword stuffing मत करो।
          - Fake या misleading claims मत करो।
          - Human-friendly language रखो।
          - Strong introduction दो।
          - H2 और H3 headings इस्तेमाल करो।
          - Practical examples और useful tips दो।
          - अंत में conclusion दो।
          - Markdown का इस्तेमाल मत करो।
          - HTML body content दो।

          केवल valid JSON लौटाओ।
          JSON के बाहर कोई text मत लिखो।

          JSON format:

          {
            "title": "Article title",
            "description": "SEO meta description maximum 155 characters",
            "slug": "url-friendly-slug",
            "keywords": "keyword1, keyword2, keyword3",
            "html": "<article>...</article>"
          }
          """

          url = "https://generativelanguage.googleapis.com/v1beta/interactions"

          payload = {
              "model": "gemini-3.7-flash",
              "input": prompt,
              "store": False,
              "generation_config": {
                  "max_output_tokens": 5000
              }
          }

          request = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "x-goog-api-key": API_KEY,
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request, timeout=180) as response:
                  data = json.loads(
                      response.read().decode("utf-8")
                  )
          except Exception as e:
              raise SystemExit(
                  f"Gemini API request failed: {e}"
              )

          if data.get("status") != "completed":
              raise SystemExit(
                  "Gemini interaction did not complete: "
                  + json.dumps(data)[:2000]
              )

          output = ""

          for step in data.get("steps", []):
              if step.get("type") == "model_output":
                  for item in step.get("content", []):
                      if item.get("type") == "text":
                          output += item.get("text", "")

          if not output:
              raise SystemExit(
                  "Gemini returned no text output."
              )

          output = output.strip()

          output = re.sub(
              r"^```json\s*",
              "",
              output,
              flags=re.I
          )

          output = re.sub(
              r"^```\s*",
              "",
              output
          )

          output = re.sub(
              r"\s*```$",
              "",
              output
          )

          try:
              article = json.loads(output)

          except json.JSONDecodeError:
              match = re.search(
                  r"\{.*\}",
                  output,
                  re.S
              )

              if not match:
                  raise SystemExit(
                      "Could not parse Gemini JSON."
                  )

              article = json.loads(
                  match.group(0)
              )

          required = [
              "title",
              "description",
              "slug",
              "keywords",
              "html"
          ]

          for key in required:
              if not article.get(key):
                  raise SystemExit(
                      f"Missing field: {key}"
                  )

          title = str(
              article["title"]
          ).strip()

          description = str(
              article["description"]
          ).strip()

          slug = str(
              article["slug"]
          ).strip().lower()

          keywords = str(
              article["keywords"]
          ).strip()

          html = str(
              article["html"]
          ).strip()

          slug = re.sub(
              r"[^a-z0-9-]",
              "-",
              slug
          )

          slug = re.sub(
              r"-+",
              "-",
              slug
          ).strip("-")

          if not slug:
              raise SystemExit(
                  "Invalid article slug."
              )

          filename = f"{slug}.html"

          if os.path.exists(filename):
              timestamp = datetime.now(
                  timezone.utc
              ).strftime(
                  "%Y%m%d%H%M"
              )

              filename = (
                  f"{slug}-{timestamp}.html"
              )

          today = datetime.now(
              timezone.utc
          ).strftime("%Y-%m-%d")

          # --------------------------------------------------
          # Create article HTML
          # --------------------------------------------------

          page = f"""<!DOCTYPE html>
          <html lang="hi">

          <head>

          <meta charset="UTF-8">

          <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
          >

          <title>{title} | AIHindiHub</title>

          <meta
            name="description"
            content="{description}"
          >

          <meta
            name="keywords"
            content="{keywords}"
          >

          <meta
            name="robots"
            content="index, follow"
          >

          <link
            rel="canonical"
            href="https://freeaimony.github.io/AiHindiHub/{filename}"
          >

          <link
            rel="stylesheet"
            href="style.css"
          >

          </head>

          <body>

          <header>

            <div class="container header">

              <div class="logo">

                <a href="index.html">
                  <img
                    src="logo.png"
                    alt="AIHindiHub Logo"
                  >
                </a>

                <h1>AIHindiHub</h1>

              </div>

              <nav>

                <a href="index.html">Home</a>

                <a href="top-10-free-ai-tools.html">
                  AI Tools
                </a>

                <a href="google-gemini-complete-guide.html">
                  Learn AI
                </a>

                <a href="how-to-earn-money-with-ai.html">
                  Earn
                </a>

              </nav>

            </div>

          </header>

          <main class="container">

            {html}

          </main>

          <footer>

            <div class="container">

              <p>
                © 2026 AIHindiHub. All Rights Reserved.
              </p>

            </div>

          </footer>

          </body>

          </html>
          """

          with open(
              filename,
              "w",
              encoding="utf-8"
          ) as f:
              f.write(page)

          # --------------------------------------------------
          # Update index.html
          # --------------------------------------------------

          index_file = "index.html"

          with open(
              index_file,
              "r",
              encoding="utf-8"
          ) as f:
              index = f.read()

          marker_start = (
              "<!-- AI-AUTO-ARTICLES-START -->"
          )

          marker_end = (
              "<!-- AI-AUTO-ARTICLES-END -->"
          )

          # Remove previous AI-generated article
          old_block = (
              re.escape(marker_start)
              + r".*?"
              + re.escape(marker_end)
          )

          index = re.sub(
              old_block,
              "",
              index,
              flags=re.S
          )

          # New article card
          new_card = f"""
          {marker_start}

          <div class="article-card ai-generated-article">

            <h3>{title}</h3>

            <p>{description}</p>

            <a
              href="{filename}"
              class="read-btn"
            >
              Read More →
            </a>

          </div>

          {marker_end}
          """

          # Find Latest Articles section
          latest_position = index.find(
              "<!-- Latest Articles -->"
          )

          if latest_position == -1:
              raise SystemExit(
                  "Latest Articles section not found."
              )

          # Find article-grid after Latest Articles
          grid_position = index.find(
              '<div class="article-grid">',
              latest_position
          )

          if grid_position == -1:
              raise SystemExit(
                  "Latest Articles article-grid not found."
              )

          insert_position = (
              grid_position
              + len('<div class="article-grid">')
          )

          # Insert new article at TOP
          index = (
              index[:insert_position]
              + new_card
              + index[insert_position:]
          )

          with open(
              index_file,
              "w",
              encoding="utf-8"
          ) as f:
              f.write(index)

          # --------------------------------------------------
          # Update sitemap.xml
          # --------------------------------------------------

          sitemap_file = "sitemap.xml"

          site_url = (
              "https://freeaimony.github.io/"
              f"AiHindiHub/{filename}"
          )

          if os.path.exists(sitemap_file):

              with open(
                  sitemap_file,
                  "r",
                  encoding="utf-8"
              ) as f:
                  sitemap = f.read()

              if site_url not in sitemap:

                  new_url = f"""
          <url>
            <loc>{site_url}</loc>
            <lastmod>{today}</lastmod>
          </url>
          """

                  if "</urlset>" in sitemap:

                      sitemap = sitemap.replace(
                          "</urlset>",
                          new_url + "\n</urlset>",
                          1
                      )

                  else:
                      sitemap += new_url

                  with open(
                      sitemap_file,
                      "w",
                      encoding="utf-8"
                  ) as f:
                      f.write(sitemap)

          print(
              "Article created:",
              filename
          )

          print(
              "Title:",
              title
          )

          print(
              "Published URL:",
              site_url
          )

          PY

      - name: Commit and push article
        run: |

          git config user.name "AiHindiHub AI"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit \
            -m "AI: publish new Hindi article"

          git push
