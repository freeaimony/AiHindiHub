name: AI Automatic Article

on:
  workflow_dispatch:

  schedule:
    # 09:00 IST
    - cron: "30 3 * * *"

    # 17:00 IST
    - cron: "30 11 * * *"

    # 23:00 IST
    - cron: "30 17 * * *"

permissions:
  contents: write

concurrency:
  group: ai-article
  cancel-in-progress: false

jobs:
  generate-article:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate article with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

        run: |

          python3 <<'PY'

          import os
          import json
          import re
          import html
          import time
          import urllib.request
          import urllib.error
          from datetime import datetime, timezone

          # ==================================================
          # SETTINGS
          # ==================================================

          API_KEY = os.environ.get("GEMINI_API_KEY")

          if not API_KEY:
              raise SystemExit(
                  "GEMINI_API_KEY secret is missing."
              )

          SITE = "https://freeaimony.github.io/AiHindiHub/"

          # ==================================================
          # FIND EXISTING ARTICLES
          # ==================================================

          existing_articles = []

          excluded_files = {
              "index.html",
              "about.html",
              "Contact.html",
              "contact.html",
              "privacy.html",
              "terms.html",
              "disclaimer.html",
              "aitools.html"
          }

          for filename in os.listdir("."):

              if not filename.endswith(".html"):
                  continue

              if filename in excluded_files:
                  continue

              try:

                  with open(
                      filename,
                      "r",
                      encoding="utf-8"
                  ) as f:

                      content = f.read()

                  match = re.search(
                      r"<title[^>]*>(.*?)</title>",
                      content,
                      re.I | re.S
                  )

                  if match:

                      article_title = re.sub(
                          r"<[^>]+>",
                          "",
                          match.group(1)
                      )

                      article_title = html.unescape(
                          article_title
                      )

                      article_title = re.sub(
                          r"\s+",
                          " ",
                          article_title
                      ).strip()

                      article_title = re.sub(
                          r"\s*\|\s*AIHindiHub.*$",
                          "",
                          article_title,
                          flags=re.I
                      ).strip()

                      if article_title:

                          existing_articles.append({
                              "file": filename,
                              "title": article_title
                          })

              except Exception:
                  pass

          print(
              "Existing articles:",
              len(existing_articles)
          )

          previous_topics = "\n".join(
              "- " + x["title"]
              for x in existing_articles[-40:]
          )

          # ==================================================
          # AI PROMPT
          # ==================================================

          prompt = f"""
          तुम AiHindiHub नाम की Hindi AI और Technology website
          के लिए एक नया original SEO-friendly article लिख रहे हो।

          Website:
          {SITE}

          Topic AI, Artificial Intelligence, AI Tools,
          Technology, Students, Productivity, Useful Apps,
          Online Work या Digital Technology से संबंधित होना चाहिए।

          पहले से प्रकाशित articles:

          {previous_topics}

          IMPORTANT RULES:

          1. नया और अलग topic चुनो।
          2. पहले से published topic को repeat मत करो।
          3. Article पूरी तरह Hindi में लिखो।
          4. जरूरी technical terms English में रख सकते हो।
          5. Content original होना चाहिए।
          6. किसी दूसरे website का text copy मत करो।
          7. Article 1000 से 1450 words के बीच होना चाहिए।
          8. किसी भी हालत में 1500 words से ज्यादा नहीं होना चाहिए।
          9. Strong introduction दो।
          10. H2 और H3 headings इस्तेमाल करो।
          11. Practical examples दो।
          12. Useful tips दो।
          13. जरूरत हो तो ul, ol और table HTML इस्तेमाल कर सकते हो।
          14. Keyword stuffing मत करो।
          15. Fake claims मत करो।
          16. Fake statistics मत बनाओ।
          17. Markdown इस्तेमाल मत करो।
          18. HTML article body दो।
          19. Article natural और human-readable होना चाहिए।
          20. अंत में Conclusion दो।
          21. Meta description maximum 155 characters हो।
          22. Slug केवल lowercase English और hyphen वाला हो।
          23. External links मत डालो।
          24. केवल valid JSON लौटाओ।

          JSON FORMAT:

          {{
            "title": "SEO Article Title",
            "description": "SEO meta description",
            "slug": "seo-friendly-slug",
            "keywords": "keyword1, keyword2, keyword3",
            "html": "<article><p>...</p><h2>...</h2></article>"
          }}

          JSON के बाहर कोई text मत लिखो।
          """

          # ==================================================
          # GEMINI API
          # ==================================================

          API_URL = (
              "https://generativelanguage.googleapis.com/"
              "v1beta/models/gemini-2.5-flash:generateContent"
              "?key=" + API_KEY
          )

          payload = {
              "contents": [
                  {
                      "parts": [
                          {
                              "text": prompt
                          }
                      ]
                  }
              ],
              "generationConfig": {
                  "temperature": 0.7,
                  "maxOutputTokens": 7000,
                  "responseMimeType": "application/json"
              }
          }

          request_data = json.dumps(
              payload,
              ensure_ascii=False
          ).encode("utf-8")

          output = None

          # ==================================================
          # RETRY
          # ==================================================

          for attempt in range(1, 4):

              print(
                  f"Gemini attempt {attempt}/3"
              )

              request = urllib.request.Request(
                  API_URL,
                  data=request_data,
                  headers={
                      "Content-Type": "application/json"
                  },
                  method="POST"
              )

              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=180
                  ) as response:

                      raw = response.read().decode(
                          "utf-8"
                      )

                  data = json.loads(raw)

                  candidates = data.get(
                      "candidates",
                      []
                  )

                  if candidates:

                      parts = (
                          candidates[0]
                          .get("content", {})
                          .get("parts", [])
                      )

                      text_parts = []

                      for part in parts:

                          if "text" in part:

                              text_parts.append(
                                  part["text"]
                              )

                      output = "".join(
                          text_parts
                      ).strip()

                  if output:

                      print(
                          "Gemini response received."
                      )

                      break

                  print(
                      "Gemini returned empty response."
                  )

              except urllib.error.HTTPError as e:

                  error_body = ""

                  try:

                      error_body = (
                          e.read()
                          .decode("utf-8")
                      )

                  except Exception:
                      pass

                  print(
                      f"Gemini HTTP {e.code}: "
                      f"{error_body[:1500]}"
                  )

              except Exception as e:

                  print(
                      "Gemini error:",
                      str(e)
                  )

              if attempt < 3:

                  wait_time = attempt * 10

                  print(
                      f"Retrying in {wait_time} seconds..."
                  )

                  time.sleep(
                      wait_time
                  )

          if not output:

              raise SystemExit(
                  "Gemini failed after 3 attempts."
              )

          # ==================================================
          # CLEAN JSON
          # ==================================================

          output = output.strip()

          output = re.sub(
              r"^```json\s*",
              "",
              output,
              flags=re.I
          )

          output = re.sub(
              r"^```\s*",
              "",
              output
          )

          output = re.sub(
              r"\s*```$",
              "",
              output
          )

          output = output.strip()

          try:

              article = json.loads(
                  output
              )

          except json.JSONDecodeError:

              match = re.search(
                  r"\{.*\}",
                  output,
                  re.S
              )

              if not match:

                  raise SystemExit(
                      "Could not parse Gemini JSON."
                  )

              article = json.loads(
                  match.group(0)
              )

          # ==================================================
          # VALIDATE
          # ==================================================

          required = [
              "title",
              "description",
              "slug",
              "keywords",
              "html"
          ]

          for key in required:

              if not article.get(key):

                  raise SystemExit(
                      f"Missing field: {key}"
                  )

          title = str(
              article["title"]
          ).strip()

          description = str(
              article["description"]
          ).strip()

          keywords = str(
              article["keywords"]
          ).strip()

          raw_html = str(
              article["html"]
          ).strip()

          # ==================================================
          # CLEAN DESCRIPTION
          # ==================================================

          description = re.sub(
              r"\s+",
              " ",
              description
          )

          description = description[:155]

          # ==================================================
          # SAFE SLUG
          # ==================================================

          slug = str(
              article["slug"]
          ).strip().lower()

          slug = re.sub(
              r"[^a-z0-9-]",
              "-",
              slug
          )

          slug = re.sub(
              r"-+",
              "-",
              slug
          ).strip("-")

          if not slug:

              raise SystemExit(
                  "Invalid article slug."
              )

          filename = (
              f"{slug}.html"
          )

          if os.path.exists(filename):

              timestamp = datetime.now(
                  timezone.utc
              ).strftime(
                  "%Y%m%d%H%M%S"
              )

              filename = (
                  f"{slug}-{timestamp}.html"
              )

          # ==================================================
          # WORD COUNT
          # ==================================================

          plain_text = re.sub(
              r"<[^>]+>",
              " ",
              raw_html
          )

          plain_text = re.sub(
              r"\s+",
              " ",
              plain_text
          ).strip()

          word_count = len(
              plain_text.split()
          )

          print(
              "Article word count:",
              word_count
          )

          if word_count > 1500:

              raise SystemExit(
                  f"Article rejected: {word_count} words. "
                  "Maximum allowed is 1500."
              )

          if word_count < 1000:

              raise SystemExit(
                  f"Article rejected: {word_count} words. "
                  "Minimum required is 1000."
              )

          # ==================================================
          # INTERNAL LINKS
          # ==================================================

          related_articles = []

          for item in reversed(
              existing_articles
          ):

              if len(
                  related_articles
              ) >= 5:

                  break

              if item["file"] == filename:

                  continue

              related_articles.append(
                  item
              )

          related_html = ""

          if related_articles:

              related_html = """
              <section class="related-articles">
                <h2>आपके लिए उपयोगी Articles</h2>
                <ul>
              """

              for item in related_articles:

                  related_html += f"""
                  <li>
                    <a href="{html.escape(item["file"], quote=True)}">
                      {html.escape(item["title"])}
                    </a>
                  </li>
                  """

              related_html += """
                </ul>
              </section>
              """

          # ==================================================
          # URL
          # ==================================================

          canonical = (
              SITE + filename
          )

          today = datetime.now(
              timezone.utc
          ).strftime(
              "%Y-%m-%d"
          )

          # ==================================================
          # ARTICLE SCHEMA
          # ==================================================

          article_schema = {

              "@context": "https://schema.org",

              "@type": "Article",

              "headline": title,

              "description": description,

              "datePublished": today,

              "dateModified": today,

              "inLanguage": "hi-IN",

              "author": {

                  "@type": "Organization",

                  "name": "AIHindiHub",

                  "url": SITE
              },

              "publisher": {

                  "@type": "Organization",

                  "name": "AIHindiHub",

                  "url": SITE
              },

              "mainEntityOfPage": {

                  "@type": "WebPage",

                  "@id": canonical
              }
          }

          # ==================================================
          # BREADCRUMB SCHEMA
          # ==================================================

          breadcrumb_schema = {

              "@context": "https://schema.org",

              "@type": "BreadcrumbList",

              "itemListElement": [

                  {

                      "@type": "ListItem",

                      "position": 1,

                      "name": "Home",

                      "item": SITE
                  },

                  {

                      "@type": "ListItem",

                      "position": 2,

                      "name": title,

                      "item": canonical
                  }
              ]
          }

          article_schema_json = json.dumps(
              article_schema,
              ensure_ascii=False,
              indent=2
          )

          breadcrumb_schema_json = json.dumps(
              breadcrumb_schema,
              ensure_ascii=False,
              indent=2
          )

          # ==================================================
          # CREATE ARTICLE PAGE
          # ==================================================

          page = f"""<!DOCTYPE html>
          <html lang="hi">

          <head>

          <meta charset="UTF-8">

          <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
          >

          <title>{html.escape(title)} | AIHindiHub</title>

          <meta
            name="description"
            content="{html.escape(description, quote=True)}"
          >

          <meta
            name="keywords"
            content="{html.escape(keywords, quote=True)}"
          >

          <meta
            name="robots"
            content="index, follow"
          >

          <link
            rel="canonical"
            href="{html.escape(canonical, quote=True)}"
          >

          <link
            rel="stylesheet"
            href="style.css"
          >

          <script type="application/ld+json">
          {article_schema_json}
          </script>

          <script type="application/ld+json">
          {breadcrumb_schema_json}
          </script>

          </head>

          <body>

          <main class="container">

            <article class="ai-generated-article">

              {raw_html}

              {related_html}

            </article>

          </main>

          </body>

          </html>
          """

          with open(
              filename,
              "w",
              encoding="utf-8"
          ) as f:

              f.write(page)

          # ==================================================
          # UPDATE HOMEPAGE
          # ==================================================

          index_file = "index.html"

          with open(
              index_file,
              "r",
              encoding="utf-8"
          ) as f:

              index = f.read()

          marker_start = (
              "<!-- AI-AUTO-ARTICLES-START -->"
          )

          marker_end = (
              "<!-- AI-AUTO-ARTICLES-END -->"
          )

          new_card = f"""
          <div class="article-card ai-generated-article-card">

            <h3>
              {html.escape(title)}
            </h3>

            <p>
              {html.escape(description)}
            </p>

            <a
              href="{html.escape(filename, quote=True)}"
              class="read-btn"
            >
              Read More →
            </a>

          </div>
          """

          if (
              marker_start in index
              and marker_end in index
          ):

              insert_at = (
                  index.find(marker_start)
                  + len(marker_start)
              )

              index = (
                  index[:insert_at]
                  + new_card
                  + index[insert_at:]
              )

          else:

              latest_position = index.find(
                  "<!-- Latest Articles -->"
              )

              if latest_position == -1:

                  raise SystemExit(
                      "Latest Articles section not found."
                  )

              grid_position = index.find(
                  '<div class="article-grid">',
                  latest_position
              )

              if grid_position == -1:

                  raise SystemExit(
                      "article-grid not found."
                  )

              insert_position = (
                  grid_position
                  + len(
                      '<div class="article-grid">'
                  )
              )

              ai_block = f"""

          {marker_start}

          {new_card}

          {marker_end}

          """

              index = (
                  index[:insert_position]
                  + ai_block
                  + index[insert_position:]
              )

          with open(
              index_file,
              "w",
              encoding="utf-8"
          ) as f:

              f.write(index)

          # ==================================================
          # REBUILD SITEMAP
          # ==================================================

          static_pages = [
              "index.html",
              "about.html",
              "aitools.html",
              "Contact.html",
              "contact.html",
              "privacy.html",
              "terms.html",
              "disclaimer.html"
          ]

          sitemap_urls = []

          for page_name in static_pages:

              if os.path.exists(page_name):

                  if page_name == "index.html":

                      sitemap_urls.append(
                          SITE
                      )

                  else:

                      sitemap_urls.append(
                          SITE + page_name
                      )

          # Add every HTML article

          for filename_on_disk in sorted(
              os.listdir(".")
          ):

              if not filename_on_disk.endswith(
                  ".html"
              ):

                  continue

              if filename_on_disk in static_pages:

                  continue

              sitemap_urls.append(
                  SITE + filename_on_disk
              )

          # Add new article

          sitemap_urls.append(
              canonical
          )

          # Remove duplicates

          sitemap_urls = list(
              dict.fromkeys(
                  sitemap_urls
              )
          )

          # ==================================================
          # SITEMAP XML
          # ==================================================

          sitemap_xml = """<?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
          """

          for sitemap_url in sitemap_urls:

              sitemap_xml += f"""
            <url>
              <loc>{html.escape(sitemap_url)}</loc>
              <lastmod>{today}</lastmod>
            </url>
          """

          sitemap_xml += """
          </urlset>
          """

          with open(
              "sitemap.xml",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  sitemap_xml.strip()
                  + "\n"
              )

          # ==================================================
          # SUCCESS
          # ==================================================

          print(
              "======================================"
          )

          print(
              "ARTICLE SUCCESSFULLY CREATED"
          )

          print(
              "======================================"
          )

          print(
              "Title:",
              title
          )

          print(
              "Words:",
              word_count
          )

          print(
              "File:",
              filename
          )

          print(
              "URL:",
              canonical
          )

          print(
              "Internal links:",
              len(related_articles)
          )

          print(
              "Sitemap URLs:",
              len(sitemap_urls)
          )

          print(
              "======================================"
          )

          PY

      # ==================================================
      # COMMIT AND PUSH
      # ==================================================

      - name: Commit and push article

        run: |

          git config user.name "AiHindiHub AI"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then

            echo "No changes to commit."

            exit 0

          fi

          git commit \
            -m "AI: publish new Hindi SEO article"

          git push
