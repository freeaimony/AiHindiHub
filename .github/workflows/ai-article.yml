name: AI Automatic Article

on:
  workflow_dispatch:

  schedule:
    # 09:00 IST
    - cron: "30 3 * * *"

    # 17:00 IST
    - cron: "30 11 * * *"

    # 23:00 IST
    - cron: "30 17 * * *"

permissions:
  contents: write

concurrency:
  group: ai-article
  cancel-in-progress: false

jobs:
  generate-article:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate article with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

        run: |

          python3 <<'PY'

          import os
          import json
          import re
          import html
          import urllib.request
          import urllib.error
          import time
          from datetime import datetime, timezone

          API_KEY = os.environ.get("GEMINI_API_KEY")

          if not API_KEY:
              raise SystemExit("GEMINI_API_KEY secret is missing.")

          SITE = "https://freeaimony.github.io/AiHindiHub/"

          # --------------------------------------------------
          # FIND EXISTING ARTICLES
          # --------------------------------------------------

          existing_articles = []

          for filename in os.listdir("."):

              if not filename.endswith(".html"):
                  continue

              if filename in [
                  "index.html",
                  "about.html",
                  "Contact.html",
                  "contact.html",
                  "privacy.html",
                  "terms.html",
                  "disclaimer.html",
                  "aitools.html"
              ]:
                  continue

              try:

                  with open(
                      filename,
                      "r",
                      encoding="utf-8"
                  ) as f:
                      content = f.read()

                  title_match = re.search(
                      r"<title>(.*?)</title>",
                      content,
                      re.I | re.S
                  )

                  if title_match:

                      title = re.sub(
                          r"\s+",
                          " ",
                          html.unescape(
                              title_match.group(1)
                          )
                      ).strip()

                      title = re.sub(
                          r"\s*\|\s*AIHindiHub.*$",
                          "",
                          title,
                          flags=re.I
                      )

                      existing_articles.append({
                          "file": filename,
                          "title": title
                      })

              except Exception:
                  pass

          existing_titles = [
              x["title"] for x in existing_articles
          ]

          print(
              "Existing articles:",
              len(existing_articles)
          )

          # Keep prompt size reasonable
          previous_topics = "\n".join(
              "- " + t
              for t in existing_titles[-40:]
          )

          # --------------------------------------------------
          # PROMPT
          # --------------------------------------------------

          prompt = f"""
          तुम AiHindiHub नाम की Hindi AI और Technology website के लिए
          एक नया original SEO-friendly article लिख रहे हो।

          Website:
          {SITE}

          आज का topic AI, Technology, AI Tools, Students,
          Productivity, Useful Apps, Online Work या Digital Technology
          से संबंधित होना चाहिए।

          पहले से प्रकाशित articles के titles:

          {previous_topics}

          IMPORTANT RULES:

          1. नया topic चुनो।
          2. ऊपर दिए गए topics/titles को दोहराओ मत।
          3. Article पूरी तरह Hindi में लिखो।
          4. जरूरी technical terms English में रख सकते हो।
          5. Content original होना चाहिए।
          6. किसी website का text copy मत करो।
          7. Article 1000 से 1450 words के बीच होना चाहिए।
          8. किसी भी हालत में 1500 words से ज्यादा नहीं होना चाहिए।
          9. Strong SEO-friendly introduction दो।
          10. H2 और H3 headings इस्तेमाल करो।
          11. Practical examples दो।
          12. Useful tips दो।
          13. जरूरत हो तो numbered list/table-style HTML दो।
          14. Keyword stuffing मत करो।
          15. Fake claims मत करो।
          16. Markdown इस्तेमाल मत करो।
          17. केवल HTML article body दो।
          18. अंत में Conclusion जरूर दो।
          19. Article natural और human-readable लगे।
          20. Title छोटा और clickable हो।
          21. Meta description 155 characters से ज्यादा न हो।
          22. Slug केवल English lowercase और hyphen वाला हो।
          23. HTML में external links की जरूरत नहीं है।
          24. केवल valid JSON लौटाओ।

          JSON FORMAT:

          {{
            "title": "SEO Article Title",
            "description": "SEO meta description",
            "slug": "seo-friendly-slug",
            "keywords": "keyword1, keyword2, keyword3",
            "html": "<article><p>...</p><h2>...</h2></article>"
          }}

          JSON के बाहर कोई text मत लिखो।
          """

          # --------------------------------------------------
          # GEMINI GENERATE CONTENT API
          # --------------------------------------------------

          url = (
              "https://generativelanguage.googleapis.com/"
              "v1beta/models/gemini-2.5-flash:generateContent"
              "?key=" + API_KEY
          )

          payload = {
              "contents": [
                  {
                      "parts": [
                          {
                              "text": prompt
                          }
                      ]
                  }
              ],
              "generationConfig": {
                  "temperature": 0.7,
                  "maxOutputTokens": 7000,
                  "responseMimeType": "application/json"
              }
          }

          request_data = json.dumps(
              payload,
              ensure_ascii=False
          ).encode("utf-8")

          output = None

          # --------------------------------------------------
          # RETRY 3 TIMES
          # --------------------------------------------------

          for attempt in range(1, 4):

              print(
                  f"Gemini attempt {attempt}/3..."
              )

              request = urllib.request.Request(
                  url,
                  data=request_data,
                  headers={
                      "Content-Type": "application/json"
                  },
                  method="POST"
              )

              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=180
                  ) as response:

                      raw = response.read().decode(
                          "utf-8"
                      )

                      data = json.loads(raw)

                  candidates = data.get(
                      "candidates",
                      []
                  )

                  if candidates:

                      parts = (
                          candidates[0]
                          .get("content", {})
                          .get("parts", [])
                      )

                      texts = []

                      for part in parts:

                          if "text" in part:
                              texts.append(
                                  part["text"]
                              )

                      output = "".join(
                          texts
                      ).strip()

                  if output:

                      print(
                          "Gemini response received."
                      )

                      break

                  print(
                      "Gemini returned empty response."
                  )

              except urllib.error.HTTPError as e:

                  error_body = ""

                  try:
                      error_body = e.read().decode(
                          "utf-8"
                      )
                  except Exception:
                      pass

                  print(
                      f"Gemini HTTP error "
                      f"{e.code}: {error_body[:1000]}"
                  )

              except Exception as e:

                  print(
                      "Gemini request error:",
                      str(e)
                  )

              if attempt < 3:

                  time.sleep(
                      attempt * 10
                  )

          if not output:

              raise SystemExit(
                  "Gemini failed after 3 attempts."
              )

          # --------------------------------------------------
          # CLEAN JSON
          # --------------------------------------------------

          output = output.strip()

          output = re.sub(
              r"^```json\s*",
              "",
              output,
              flags=re.I
          )

          output = re.sub(
              r"^```\s*",
              "",
              output
          )

          output = re.sub(
              r"\s*```$",
              "",
              output
          )

          try:

              article = json.loads(
                  output
              )

          except json.JSONDecodeError:

              match = re.search(
                  r"\{.*\}",
                  output,
                  re.S
              )

              if not match:

                  raise SystemExit(
                      "Could not parse Gemini JSON."
                  )

              article = json.loads(
                  match.group(0)
              )

          # --------------------------------------------------
          # VALIDATE
          # --------------------------------------------------

          required = [
              "title",
              "description",
              "slug",
              "keywords",
              "html"
          ]

          for key in required:

              if not article.get(key):

                  raise SystemExit(
                      f"Missing field: {key}"
                  )

          title = str(
              article["title"]
          ).strip()

          description = str(
              article["description"]
          ).strip()

          keywords = str(
              article["keywords"]
          ).strip()

          raw_html = str(
              article["html"]
          ).strip()

          # --------------------------------------------------
          # SAFE SLUG
          # --------------------------------------------------

          slug = str(
              article["slug"]
          ).strip().lower()

          slug = re.sub(
              r"[^a-z0-9-]",
              "-",
              slug
          )

          slug = re.sub(
              r"-+",
              "-",
              slug
          ).strip("-")

          if not slug:

              raise SystemExit(
                  "Invalid article slug."
              )

          filename = f"{slug}.html"

          if os.path.exists(filename):

              timestamp = datetime.now(
                  timezone.utc
              ).strftime(
                  "%Y%m%d%H%M%S"
              )

              filename = (
                  f"{slug}-{timestamp}.html"
              )

          # --------------------------------------------------
          # WORD COUNT
          # --------------------------------------------------

          plain_text = re.sub(
              r"<[^>]+>",
              " ",
              raw_html
          )

          plain_text = re.sub(
              r"\s+",
              " ",
              plain_text
          ).strip()

          word_count = len(
              plain_text.split()
          )

          print(
              "Article word count:",
              word_count
          )

          if word_count > 1500:

              raise SystemExit(
                  f"Article rejected: "
                  f"{word_count} words. "
                  "Maximum is 1500."
              )

          if word_count < 1000:

              raise SystemExit(
                  f"Article rejected: "
                  f"{word_count} words. "
                  "Minimum is 1000."
              )

          # --------------------------------------------------
          # ESCAPE META VALUES
          # --------------------------------------------------

          safe_title = html.escape(
              title,
              quote=True
          )

          safe_description = html.escape(
              description,
              quote=True
          )

          safe_keywords = html.escape(
              keywords,
              quote=True
          )

          canonical = (
              SITE + filename
          )

          # --------------------------------------------------
          # INTERNAL LINKS
          # --------------------------------------------------

          related = []

          for item in reversed(
              existing_articles
          ):

              if len(related) >= 5:
                  break

              if item["file"] == filename:
                  continue

              related.append(item)

          related_html = ""

          if related:

              related_html += """
              <section class="related-articles">
              <h2>आपके लिए उपयोगी Articles</h2>
              <ul>
              """

              for item in related:

                  related_html += f"""
                  <li>
                    <a href="{html.escape(item["file"], quote=True)}">
                      {html.escape(item["title"])}
                    </a>
                  </li>
                  """

              related_html += """
              </ul>
              </section>
              """

          # --------------------------------------------------
          # SCHEMA
          # --------------------------------------------------

          today = datetime.now(
              timezone.utc
          ).strftime(
              "%Y-%m-%d"
          )

          schema = {
              "@context": "https://schema.org",
              "@type": "Article",
              "headline": title,
              "description": description,
              "datePublished": today,
              "dateModified": today,
              "author": {
                  "@type": "Organization",
                  "name": "AIHindiHub"
              },
              "publisher": {
                  "@type": "Organization",
                  "name": "AIHindiHub"
              },
              "mainEntityOfPage": {
                  "@type": "WebPage",
                  "@id": canonical
              }
          }

          breadcrumb = {
              "@context": "https://schema.org",
              "@type": "BreadcrumbList",
              "itemListElement": [
                  {
                      "@type": "ListItem",
                      "position": 1,
                      "name": "Home",
                      "item": SITE
                  },
                  {
                      "@type": "ListItem",
                      "position": 2,
                      "name": title,
                      "item": canonical
                  }
              ]
          }

          schema_json = json.dumps(
              schema,
              ensure_ascii=False
          )

          breadcrumb_json = json.dumps(
              breadcrumb,
              ensure_ascii=False
          )

          # --------------------------------------------------
          # ARTICLE PAGE
          # --------------------------------------------------

          page = f"""<!DOCTYPE html>
          <html lang="hi">

          <head>

          <meta charset="UTF-8">

          <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
          >

          <title>{safe_title} | AIHindiHub</title>

          <meta
            name="description"
            content="{safe_description}"
          >

          <meta
            name="keywords"
            content="{safe_keywords}"
          >

          <meta
            name="robots"
            content="index, follow"
          >

          <link
            rel="canonical"
            href="{canonical}"
          >

          <link
            rel="stylesheet"
            href="style.css"
          >

          <script type="application/ld+json">
          {schema_json}
          </script>

          <script type="application/ld+json">
          {breadcrumb_json}
          </script>

          </head>

          <body>

          <main class="container">

            <article class="ai-generated-article">

              {raw_html}

              {related_html}

            </article>

          </main>

          </body>

          </html>
          """

          with open(
              filename,
              "w",
              encoding="utf-8"
          ) as f:

              f.write(page)

          # --------------------------------------------------
          # HOMEPAGE UPDATE
          # --------------------------------------------------

          index_file = "index.html"

          with open(
              index_file,
              "r",
              encoding="utf-8"
          ) as f:

              index = f.read()

          marker_start = (
              "<!-- AI-AUTO-ARTICLES-START -->"
          )

          marker_end = (
              "<!-- AI-AUTO-ARTICLES-END -->"
          )

          new_card = f"""
          <div class="article-card ai-generated-article-card">

            <h3>{safe_title}</h3>

            <p>{safe_description}</p>

            <a
              href="{filename}"
              class="read-btn"
            >
              Read More →
            </a>

          </div>
          """

          if (
              marker_start in index
              and marker_end in index
          ):

              insert_at = (
                  index.find(marker_start)
                  + len(marker_start)
              )

              index = (
                  index[:insert_at]
                  + new_card
                  + index[insert_at:]
              )

          else:

              latest_position = index.find(
                  "<!-- Latest Articles -->"
              )

              if latest_position == -1:

                  raise SystemExit(
                      "Latest Articles section not found."
                  )

              grid_position = index.find(
                  '<div class="article-grid">',
                  latest_position
              )

              if grid_position == -1:

                  raise SystemExit(
                      "article-grid not found."
                  )

              insert_position = (
                  grid_position
                  + len(
                      '<div class="article-grid">'
                  )
              )

              ai_block = f"""

          {marker_start}

          {new_card}

          {marker_end}

          """

              index = (
                  index[:insert_position]
                  + ai_block
                  + index[insert_position:]
              )

          with open(
              index_file,
              "w",
              encoding="utf-8"
          ) as f:

              f.write(index)

          # --------------------------------------------------
          # REBUILD SITEMAP
          # --------------------------------------------------

          sitemap_urls = []

          static_pages = [
              "index.html",
              "about.html",
              "aitools.html",
              "Contact.html",
              "privacy.html",
              "terms.html",
              "disclaimer.html"
          ]

          for static_file in static_pages:

              if os.path.exists(static_file):

                  sitemap_urls.append(
                      SITE
                      if static_file == "index.html"
                      else SITE + static_file
                  )

          for item in sorted(
              existing_articles,
              key=lambda x: x["file"]
          ):

              sitemap_urls.append(
                  SITE + item["file"]
              )

          sitemap_urls.append(
              canonical
          )

          # Remove duplicates
          sitemap_urls = list(
              dict.fromkeys(
                  sitemap_urls
              )
          )

          sitemap_xml = """<?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
          """

          for sitemap_url in sitemap_urls:

              sitemap_xml += f"""
          <url>
            <loc>{html.escape(sitemap_url)}</loc>
            <lastmod>{today}</lastmod>
          </url>
          """

          sitemap_xml += """
          </urlset>
          """

          with open(
              "sitemap.xml",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  sitemap_xml
              )

          # --------------------------------------------------
          # FINISH
          # --------------------------------------------------

          print("--------------------------------")
          print("ARTICLE SUCCESSFULLY CREATED")
          print("--------------------------------")
          print("Title:", title)
          print("Words:", word_count)
          print("File:", filename)
          print("URL:", canonical)
          print("Sitemap URLs:", len(sitemap_urls))
          print("--------------------------------")

          PY

      # --------------------------------------------------
      # COMMIT AND PUSH
      # --------------------------------------------------

      - name: Commit and push article

        run: |

          git config user.name "AiHindiHub AI"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then

            echo "No changes to commit."

            exit 0

          fi

          git commit \
            -m "AI: publish new Hindi SEO article"

          git push
