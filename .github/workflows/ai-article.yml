name: AI Automatic Article

on:
  workflow_dispatch:

  schedule:
    # 09:00 IST
    - cron: "30 3 * * *"

    # 17:00 IST
    - cron: "30 11 * * *"

    # 23:00 IST
    - cron: "30 17 * * *"

permissions:
  contents: write

jobs:
  generate-article:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate article with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

        run: |

          python3 <<'PY'

          import os
          import json
          import re
          import urllib.request
          from datetime import datetime, timezone

          API_KEY = os.environ.get("GEMINI_API_KEY")

          if not API_KEY:
              raise SystemExit(
                  "GEMINI_API_KEY secret is missing."
              )

          # --------------------------------------------------
          # AI PROMPT
          # --------------------------------------------------

          prompt = """
          तुम AiHindiHub नाम की Hindi AI और Technology website के लिए
          एक नया original SEO-friendly article लिख रहे हो।

          आज का topic AI, Technology, AI Tools, Students,
          Productivity, Useful Apps, Online Work या Digital Technology
          से संबंधित होना चाहिए।

          IMPORTANT:

          1. Article पूरी तरह Hindi में लिखो।
          2. जरूरी technical terms English में रख सकते हो।
          3. Article ORIGINAL होना चाहिए।
          4. किसी दूसरे website का text copy मत करो।
          5. Article 1000 से 1450 words के बीच रखो।
          6. किसी भी हालत में 1500 words से ज्यादा मत लिखो।
          7. Strong introduction दो।
          8. H2 और H3 headings इस्तेमाल करो।
          9. Practical examples दो।
          10. Useful tips दो।
          11. अंत में Conclusion दो।
          12. Keyword stuffing मत करो।
          13. Fake claims मत करो।
          14. Markdown इस्तेमाल मत करो।
          15. HTML body content दो।

          आज पहले से प्रकाशित सामान्य topics को दोहराने से बचो।

          केवल valid JSON लौटाओ।

          JSON format:

          {
            "title": "SEO Article Title",
            "description": "SEO meta description maximum 155 characters",
            "slug": "seo-friendly-slug",
            "keywords": "keyword1, keyword2, keyword3",
            "html": "<article>...</article>"
          }

          JSON के बाहर कोई text मत लिखो।
          """

          # --------------------------------------------------
          # GEMINI API
          # --------------------------------------------------

          url = (
              "https://generativelanguage.googleapis.com/"
              "v1beta/interactions"
          )

          payload = {
              "model": "gemini-3.7-flash",
              "input": prompt,
              "store": False,
              "generation_config": {
                  "max_output_tokens": 5000
              }
          }

          request = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "x-goog-api-key": API_KEY,
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          try:

              with urllib.request.urlopen(
                  request,
                  timeout=180
              ) as response:

                  data = json.loads(
                      response.read().decode("utf-8")
                  )

          except Exception as e:

              raise SystemExit(
                  f"Gemini API request failed: {e}"
              )

          # --------------------------------------------------
          # CHECK RESPONSE
          # --------------------------------------------------

          if data.get("status") != "completed":

              raise SystemExit(
                  "Gemini interaction did not complete: "
                  + json.dumps(data)[:2000]
              )

          output = ""

          for step in data.get("steps", []):

              if step.get("type") == "model_output":

                  for item in step.get("content", []):

                      if item.get("type") == "text":

                          output += item.get(
                              "text",
                              ""
                          )

          if not output:

              raise SystemExit(
                  "Gemini returned no text."
              )

          output = output.strip()

          # Remove markdown fences if AI adds them
          output = re.sub(
              r"^```json\s*",
              "",
              output,
              flags=re.I
          )

          output = re.sub(
              r"^```\s*",
              "",
              output
          )

          output = re.sub(
              r"\s*```$",
              "",
              output
          )

          # --------------------------------------------------
          # PARSE JSON
          # --------------------------------------------------

          try:

              article = json.loads(output)

          except json.JSONDecodeError:

              match = re.search(
                  r"\{.*\}",
                  output,
                  re.S
              )

              if not match:

                  raise SystemExit(
                      "Could not parse Gemini JSON."
                  )

              article = json.loads(
                  match.group(0)
              )

          required = [
              "title",
              "description",
              "slug",
              "keywords",
              "html"
          ]

          for key in required:

              if not article.get(key):

                  raise SystemExit(
                      f"Missing field: {key}"
                  )

          title = str(
              article["title"]
          ).strip()

          description = str(
              article["description"]
          ).strip()

          slug = str(
              article["slug"]
          ).strip().lower()

          keywords = str(
              article["keywords"]
          ).strip()

          html = str(
              article["html"]
          ).strip()

          # --------------------------------------------------
          # WORD COUNT
          # --------------------------------------------------

          plain_text = re.sub(
              r"<[^>]+>",
              " ",
              html
          )

          plain_text = re.sub(
              r"\s+",
              " ",
              plain_text
          ).strip()

          word_count = len(
              plain_text.split()
          )

          print(
              f"Article word count: {word_count}"
          )

          # HARD LIMIT
          if word_count > 1500:

              raise SystemExit(
                  f"Article rejected: "
                  f"{word_count} words. "
                  "Maximum allowed is 1500."
              )

          if word_count < 1000:

              raise SystemExit(
                  f"Article rejected: "
                  f"{word_count} words. "
                  "Minimum required is 1000."
              )

          # --------------------------------------------------
          # SAFE SLUG
          # --------------------------------------------------

          slug = re.sub(
              r"[^a-z0-9-]",
              "-",
              slug
          )

          slug = re.sub(
              r"-+",
              "-",
              slug
          ).strip("-")

          if not slug:

              raise SystemExit(
                  "Invalid article slug."
              )

          filename = f"{slug}.html"

          # Prevent overwrite
          if os.path.exists(filename):

              timestamp = datetime.now(
                  timezone.utc
              ).strftime(
                  "%Y%m%d%H%M%S"
              )

              filename = (
                  f"{slug}-{timestamp}.html"
              )

          today = datetime.now(
              timezone.utc
          ).strftime("%Y-%m-%d")

          # --------------------------------------------------
          # ARTICLE PAGE
          # --------------------------------------------------

          page = f"""<!DOCTYPE html>
          <html lang="hi">

          <head>

          <meta charset="UTF-8">

          <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
          >

          <title>{title} | AIHindiHub</title>

          <meta
            name="description"
            content="{description}"
          >

          <meta
            name="keywords"
            content="{keywords}"
          >

          <meta
            name="robots"
            content="index, follow"
          >

          <link
            rel="canonical"
            href="https://freeaimony.github.io/AiHindiHub/{filename}"
          >

          <link
            rel="stylesheet"
            href="style.css"
          >

          </head>

          <body>

          <main class="container">

            <article class="ai-generated-article">

              {html}

            </article>

          </main>

          </body>

          </html>
          """

          with open(
              filename,
              "w",
              encoding="utf-8"
          ) as f:

              f.write(page)

          # --------------------------------------------------
          # UPDATE HOMEPAGE
          # --------------------------------------------------

          index_file = "index.html"

          with open(
              index_file,
              "r",
              encoding="utf-8"
          ) as f:

              index = f.read()

          marker_start = (
              "<!-- AI-AUTO-ARTICLES-START -->"
          )

          marker_end = (
              "<!-- AI-AUTO-ARTICLES-END -->"
          )

          new_card = f"""
          <div class="article-card ai-generated-article-card">

            <h3>{title}</h3>

            <p>{description}</p>

            <a
              href="{filename}"
              class="read-btn"
            >
              Read More →
            </a>

          </div>
          """

          # --------------------------------------------------
          # IF AI BLOCK ALREADY EXISTS
          # INSERT NEW ARTICLE AT TOP
          # --------------------------------------------------

          if (
              marker_start in index
              and marker_end in index
          ):

              insert_at = (
                  index.find(marker_start)
                  + len(marker_start)
              )

              index = (
                  index[:insert_at]
                  + new_card
                  + index[insert_at:]
              )

          else:

              # Find Latest Articles
              latest_position = index.find(
                  "<!-- Latest Articles -->"
              )

              if latest_position == -1:

                  raise SystemExit(
                      "Latest Articles section not found."
                  )

              # Find article grid
              grid_position = index.find(
                  '<div class="article-grid">',
                  latest_position
              )

              if grid_position == -1:

                  raise SystemExit(
                      "article-grid not found."
                  )

              insert_position = (
                  grid_position
                  + len(
                      '<div class="article-grid">'
                  )
              )

              ai_block = f"""

          {marker_start}

          {new_card}

          {marker_end}

          """

              index = (
                  index[:insert_position]
                  + ai_block
                  + index[insert_position:]
              )

          with open(
              index_file,
              "w",
              encoding="utf-8"
          ) as f:

              f.write(index)

          # --------------------------------------------------
          # UPDATE SITEMAP
          # --------------------------------------------------

          sitemap_file = "sitemap.xml"

          site_url = (
              "https://freeaimony.github.io/"
              f"AiHindiHub/{filename}"
          )

          if os.path.exists(sitemap_file):

              with open(
                  sitemap_file,
                  "r",
                  encoding="utf-8"
              ) as f:

                  sitemap = f.read()

              if site_url not in sitemap:

                  new_url = f"""
          <url>
            <loc>{site_url}</loc>
            <lastmod>{today}</lastmod>
          </url>
          """

                  if "</urlset>" in sitemap:

                      sitemap = sitemap.replace(
                          "</urlset>",
                          new_url
                          + "\n</urlset>",
                          1
                      )

                  else:

                      sitemap += new_url

                  with open(
                      sitemap_file,
                      "w",
                      encoding="utf-8"
                  ) as f:

                      f.write(sitemap)

          print("--------------------------------")
          print("ARTICLE SUCCESSFULLY CREATED")
          print("--------------------------------")
          print("Title:", title)
          print("Words:", word_count)
          print("File:", filename)
          print("URL:", site_url)
          print("--------------------------------")

          PY

      # --------------------------------------------------
      # COMMIT
      # --------------------------------------------------

      - name: Commit and push article

        run: |

          git config user.name "AiHindiHub AI"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then

            echo "No changes to commit."

            exit 0

          fi

          git commit \
            -m "AI: publish new Hindi SEO article"

          git push
